name: Security Scan (Gitleaks)

# 云端密钥泄露扫描，独立于本地 pre-commit 钩子：
# - 推送 main / desktop-zh-cn / security/** 分支、向 main / desktop-zh-cn 提 PR 时自动运行；
# - 每周一全量复扫一次；
# - release.yml 发布前通过 workflow_call 调用，扫描不通过就不会打包和发布。
# 报告全部脱敏（--redact），日志里不会出现密钥原文。

on:
  push:
    branches:
      - main
      - desktop-zh-cn
      - "security/**"
  pull_request:
    branches:
      - main
      - desktop-zh-cn
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (pinned version, SHA-256 verified)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan history and changed files (redacted)
        run: bash scripts/security-scan.sh
