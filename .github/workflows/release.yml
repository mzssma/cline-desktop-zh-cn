name: Release Desktop App (Cline 中文版)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v0.0.43). Leave empty to use branch HEAD."
        required: false
        type: string
      publish_release:
        description: "Create and publish a GitHub Release. Leave unchecked to only build and upload Actions artifacts (for review before release)."
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

# 默认不给 GITHUB_TOKEN 任何权限，每个 job 只申请自己需要的最小权限。
permissions: {}

jobs:
  # 1) 云端密钥扫描（Gitleaks，脱敏报告）。发现我们自己提交里的疑似密钥时直接失败，后续打包和发布都不会执行。
  security-scan:
    name: Security gate (Gitleaks)
    permissions:
      contents: read
    uses: ./.github/workflows/security-scan.yml

  # 2) 汉化完整性、类型检查与单元测试。不通过则不能发布（发布 job 依赖它）。
  checks:
    name: Localization, typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and UI packages
        run: bun run build:sdk

      - name: Localization dictionary check
        run: bun scripts/check-translations.ts

      - name: Desktop typecheck
        working-directory: apps/examples/desktop-app
        run: bun run typecheck

      - name: Desktop webview unit tests
        working-directory: apps/examples/desktop-app
        run: bunx vitest run webview --config vitest.config.ts

      - name: "@cline/ui unit tests"
        working-directory: sdk/packages/ui
        run: bun run test

  # 3) Windows 打包（安装版 + 免安装版）。只读权限；签名私钥只注入到 Tauri 构建这一步。
  build:
    name: Build Windows Desktop
    needs: security-scan
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      version: ${{ steps.release_tag.outputs.version }}
      notes_file: ${{ steps.release_tag.outputs.notes_file }}
      publish: ${{ steps.release_tag.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # 所有外部输入都经 env 传入、不直接拼进脚本，并用正则严格校验，防止脚本注入。
      - name: Determine and validate release tag
        id: release_tag
        shell: bash
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/examples/desktop-app/src-tauri/tauri.conf.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tauri.conf.json version is not in X.Y.Z format"
            exit 1
          fi
          if [ -n "$INPUT_VERSION_TAG" ]; then
            TAG="$INPUT_VERSION_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v${VERSION}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got an invalid value)"
            exit 1
          fi
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi
          PUBLISH=false
          if [ "$REF_TYPE" = "tag" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            PUBLISH=true
            # 正式发布只允许来自已推送到 desktop-zh-cn 的提交，防止从临时/安全分支直接发版。
            git fetch --no-tags --quiet origin desktop-zh-cn
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "::error::Publishing is only allowed for commits already on desktop-zh-cn. Merge to desktop-zh-cn first."
              exit 1
            fi
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "publish=${PUBLISH}"
            if [ -f "RELEASE_NOTES_${TAG}.zh.md" ]; then
              echo "notes_file=RELEASE_NOTES_${TAG}.zh.md"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${TAG} (version ${VERSION}, publish=${PUBLISH})"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Seed Bun cache with Linux remote-helper runtimes
        shell: bash
        run: |
          BUN_VERSION="$(bun --version)"
          CACHE_DIR="${RUNNER_TEMP//\\//}/bun-install-cache"
          mkdir -p "$CACHE_DIR"
          for target in linux-x64-baseline linux-aarch64; do
            dest="$CACHE_DIR/bun-$target-v$BUN_VERSION"
            work="$(mktemp -d)"
            (cd "$work" && npm pack "@oven/bun-$target@$BUN_VERSION" --silent >/dev/null && tar -xzf ./*.tgz package/bin/bun)
            mv "$work/package/bin/bun" "$dest"
            if [ "$(head -c 4 "$dest" | od -An -c | tr -d ' ')" != "177ELF" ]; then
              echo "$dest is not an ELF executable; refusing to seed a bad runtime"
              exit 1
            fi
            echo "seeded $dest ($(stat -c %s "$dest") bytes)"
          done
          echo "BUN_INSTALL_CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"

      - name: Install UPX
        run: choco install upx --version 5.2.1 --no-progress -y

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and UI packages
        run: bun run build:sdk

      - name: Build Tauri Desktop (NSIS & Portable)
        shell: bash
        working-directory: apps/examples/desktop-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bunx tauri build --bundles nsis

      - name: Prepare Release Artifacts
        id: artifacts
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          VERSION: ${{ steps.release_tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist-release
          NSIS_DIR="apps/examples/desktop-app/src-tauri/target/release/bundle/nsis"
          PORTABLE_EXE="apps/examples/desktop-app/src-tauri/target/release/cline-app.exe"

          # GitHub rewrites non-ASCII asset names (e.g. "Cline 中文版_..." became "Cline._..."),
          # so give the installer a stable ASCII name that latest.json can point at.
          SETUP_SRC=$(find "$NSIS_DIR" -maxdepth 1 -type f -name "*_${VERSION}_x64-setup.exe" | head -n 1)
          if [ -z "$SETUP_SRC" ] || [ ! -f "${SETUP_SRC}.sig" ]; then
            echo "::error::NSIS installer or its updater signature (.sig) for ${VERSION} not found in ${NSIS_DIR}"
            ls -la "$NSIS_DIR" || true
            exit 1
          fi
          SETUP_NAME="Cline-zh-CN_${VERSION}_x64-setup.exe"
          cp -v "$SETUP_SRC" "dist-release/${SETUP_NAME}"
          cp -v "${SETUP_SRC}.sig" "dist-release/${SETUP_NAME}.sig"

          if [ -f "$PORTABLE_EXE" ]; then
            cp -v "$PORTABLE_EXE" dist-release/cline-app.exe
          fi

          # Tauri v2 updater manifest served at releases/latest/download/latest.json
          SETUP_NAME="$SETUP_NAME" node -e '
            const fs = require("fs");
            const { TAG, VERSION, SETUP_NAME, REPO } = process.env;
            const signature = fs.readFileSync(`dist-release/${SETUP_NAME}.sig`, "utf8").trim();
            const url = `https://github.com/${REPO}/releases/download/${encodeURIComponent(TAG)}/${encodeURIComponent(SETUP_NAME)}`;
            const platform = { signature, url };
            const manifest = {
              version: VERSION,
              notes: `Cline 中文版 ${TAG}：基于官方 Cline Desktop ${TAG} 的简体中文汉化版，详见 https://github.com/${REPO}/releases/tag/${TAG}`,
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              platforms: { "windows-x86_64": platform, "windows-x86_64-nsis": platform },
            };
            fs.writeFileSync("dist-release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat dist-release/latest.json

          echo "=== Artifacts ==="
          ls -la dist-release/

      - name: Upload build artifacts (for review)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cline-zh-cn-windows-${{ github.sha }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  # 4) 发布 Release：只有推送 v* 标签或手动勾选 publish_release 时才运行，
  #    且必须等密钥扫描、汉化检查/测试、打包全部成功。只有这个 job 拿 contents: write，且不执行仓库代码。
  release:
    name: Publish GitHub Release
    needs: [security-scan, checks, build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            RELEASE_NOTES_*.zh.md
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cline-zh-cn-windows-${{ github.sha }}
          path: dist-release

      - name: Verify artifacts match the release version
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          SETUP="dist-release/Cline-zh-CN_${VERSION}_x64-setup.exe"
          test -f "$SETUP" && test -f "${SETUP}.sig" && test -f dist-release/latest.json
          test "$(jq -r .version dist-release/latest.json)" = "$VERSION"
          jq -e --arg tag "$TAG" --arg v "$VERSION" \
            '[.platforms[].url] | all(endswith("/download/" + $tag + "/Cline-zh-CN_" + $v + "_x64-setup.exe"))' \
            dist-release/latest.json >/dev/null
          test "$(jq -r '.platforms["windows-x86_64"].signature' dist-release/latest.json)" = "$(tr -d '\r\n' < "${SETUP}.sig")"
          ls -la dist-release/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Cline 中文版 ${{ needs.build.outputs.tag }}"
          body_path: ${{ needs.build.outputs.notes_file }}
          body: |
            ### 🤖 Cline Desktop 简体中文汉化版 ${{ needs.build.outputs.tag }}

            本版本基于 Cline Desktop 官方 Release 制作，已完成全部界面、菜单、设置及系统托盘的深度简体中文汉化。

            #### ✨ 版本特性：
            - **独立安装共存**：产品标识为 `bot.cline.app.zhcn`，与官方英文原版可同时安装、独立运行，不抢焦点、不互相覆盖。
            - **数据共享互通**：共享 `~/.cline` 配置，历史任务、模型设置与 API Key 100% 互通。
            - **自动检测更新**：集成在线更新检测，新版本发布后支持自动检查升级。

            #### 📦 下载说明：
            - **Windows 独立安装版**：下载 `Cline-zh-CN_*_x64-setup.exe`，双击根据向导安装。
            - **Windows 绿色免安装版**：下载 `cline-app.exe`，双击直接运行。
          files: |
            dist-release/*
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
